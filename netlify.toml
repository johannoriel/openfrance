# Proxy des données distantes via Netlify (same-origin -> pas de CORS)
[[redirects]]
  from = "/data/delinquance-dep.csv"
  to = "https://static.data.gouv.fr/resources/bases-statistiques-communale-departementale-et-regionale-de-la-delinquance-enregistree-par-la-police-et-la-gendarmerie-nationales/20260709-120038/donnee-dep-data.gouv-2025-geographie2026-produit-le2026-06-25.csv"
  status = 200
  force = true

[[redirects]]
  from = "/data/departements.json"
  to = "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson"
  status = 200
  force = true

# Proxy vers l'API tabulaire data.gouv (données communales) — les query strings sont préservés
[[redirects]]
  from = "/api/communes/*"
  to = "https://tabular-api.data.gouv.fr/api/resources/44ef4323-1097-48d5-8719-3c544b55d294/data/:splat"
  status = 200
  force = true

# Contours des communes, par département (france-geojson, données IGN)
[[redirects]]
  from = "/geo/communes/*"
  to = "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/:splat"
  status = 200
  force = true
